<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everstead · Phase 24A deterministic balance report</title>
  <style>
    :root{color-scheme:dark}body{margin:0;padding:20px;background:#0c1714;color:#edf6ef;font:14px/1.45 system-ui}main{max-width:980px;margin:auto}.summary{display:flex;gap:12px;flex-wrap:wrap}.metric{padding:10px;background:#172722;border:1px solid #345148;border-radius:10px}button{min-height:44px;padding:10px 18px;border:0;border-radius:8px;font-weight:800}button:disabled{opacity:.55}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111d19;border:1px solid #345148;border-radius:10px;padding:14px}.error{color:#ff9292}
  </style>
</head>
<body>
  <main>
    <h1>Phase 24A deterministic balance report</h1>
    <p>Read-only capture from the versioned production scaling authority. It does not change saves or balance values.</p>
    <button id="run">Run report</button>
    <div class="summary">
      <p class="metric">Mode <b id="mode">WAITING</b></p>
      <p class="metric">Profiles <b id="profiles">0</b></p>
      <p class="metric">Errors <b id="errors">0</b></p>
    </div>
    <pre id="fatal" class="error"></pre>
    <pre id="phase24-report"></pre>
  </main>
  <script src="runner.js?v=1"></script>
</body>
</html>
