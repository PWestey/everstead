<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everstead · Phase 12 independent gate</title>
  <style>
    :root{color-scheme:dark}body{margin:0;background:#0c1714;color:#edf6ef;font:14px/1.45 system-ui;padding:20px}main{max-width:980px;margin:auto}.summary{display:flex;gap:12px;flex-wrap:wrap}.metric,.result{background:#172722;border:1px solid #345148;border-radius:10px;padding:10px}.result{display:flex;justify-content:space-between;gap:12px;margin:7px 0;overflow-wrap:anywhere}.pass{color:#83e4a7}.fail{color:#ff9292}button{min-height:44px;padding:10px 18px;border:0;border-radius:8px;font-weight:800}code{white-space:normal}#fatal{color:#ff9292;white-space:pre-wrap}.note{color:#afc7bf}
  </style>
</head>
<body>
  <main>
    <h1>Phase 12 · Independent architecture gate</h1>
    <p class="note">Runs only against isolated in-memory saves. A Phase 11H build is expected to fail closed because the Phase 12 QA bridge does not yet exist.</p>
    <button id="run">Run verification</button>
    <div class="summary">
      <p class="metric">Mode <b id="mode">WAITING</b></p>
      <p class="metric">Total <b id="total">0</b></p>
      <p class="metric">Passed <b id="passed">0</b></p>
      <p class="metric">Failed <b id="failed">0</b></p>
    </div>
    <pre id="fatal"></pre>
    <section id="results"></section>
  </main>
  <script src="runner.js?v=1"></script>
</body>
</html>
