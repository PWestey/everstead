<style>
body{margin:0;background:#101812;color:#eef4ec;font:14px/1.45 system-ui,sans-serif}.shell{max-width:980px;margin:auto;padding:20px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.result{background:#18231b;border:1px solid #385141;border-radius:10px;padding:12px}.result{display:flex;justify-content:space-between;gap:12px;margin-top:7px}.pass{color:#82e09b}.fail,#fatal{color:#ff9393}button{padding:10px 16px;border:0;border-radius:8px;background:#c8ad64;color:#15170f;font-weight:800}code{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:560px){.summary{grid-template-columns:repeat(2,1fr)}}

</head>
<body><main class="shell"><h1>Phase 11A · Daily-use clarity gate</h1><button id="run">Run</button><p id="fatal"></p><section class="summary"><div class="card">Mode<br><b id="mode">WAITING</b></div><div class="card">Total<br><b id="total">0</b></div><div class="card">Passed<br><b id="passed">0</b></div><div class="card">Failed<br><b id="failed">0</b></div></section><section id="results"></section></main><script src="./runner.js"></script></body>
