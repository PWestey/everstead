name: Everstead QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase-11e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Everstead
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase 11E successor gate
        run: node qa/phase-11e/verify.mjs
