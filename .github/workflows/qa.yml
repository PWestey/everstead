name: Everstead QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase-11f:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Everstead
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase 11F successor gate
        run: node qa/phase-11f/verify.mjs
