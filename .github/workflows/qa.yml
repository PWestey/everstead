name: Everstead QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase-24c2d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Everstead
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Phase 24C-2D release authority
        run: node qa/phase-24c2d-release-authority/verify.mjs
      - name: Verify Phase 24C-2D integration contract
        run: node qa/phase-24c2d-integration/verify.mjs
      - name: Verify Phase 24C-2D frozen evidence
        run: shasum -a 256 -c qa/phase-24c2d-integration/checksums.sha256
